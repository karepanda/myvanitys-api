name: CI Workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '**/*.java'
      - '**/pom.xml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Java version from pom.xml
        id: java-version
        run: |
          JAVA_VERSION=$(grep -oPm1 "(?<=<java.version>)[^<]+" pom.xml)
          echo "Detected Java version: $JAVA_VERSION"
          echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: 'temurin'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Unit Tests
        id: unit-tests
        run: mvn clean test jacoco:report jacoco:check
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Log JaCoCo Report URL
        if: steps.unit-tests.outcome == 'success'
        run: |
          echo "============================================================"
          echo "JaCoCo Coverage Report available as artifact:"
          echo "Artifact name: jacoco-report"
          echo "You can download it from the workflow run page."
          echo "============================================================"

      - name: Integration Tests
        run: mvn failsafe:integration-test failsafe:verify
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}

      - name: Mutation Testing
        id: mutation-tests
        run: mvn test-compile org.pitest:pitest-maven:mutationCoverage
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}

      - name: Upload PIT mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports

      - name: Log PIT Report URL
        if: steps.mutation-tests.outcome == 'success'
        run: |
          echo "============================================================"
          echo "PIT Mutation Report available as artifact:"
          echo "Artifact name: pit-report"
          echo "You can download it from the workflow run page."
          echo "============================================================"

      - name: Package
        run: mvn package -DskipTests
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}