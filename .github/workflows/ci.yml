name: CI Workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '.github/workflows/*.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Java version from pom.xml
        id: java-version
        run: |
          JAVA_VERSION=$(grep -oPm1 "(?<=<java.version>)[^<]+" pom.xml)
          echo "Detected Java version: $JAVA_VERSION"
          echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: 'temurin'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Resolve Maven dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if mvn -B -U -ntp -DskipTests dependency:go-offline; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Maven dependency resolution failed after 3 attempts."
              exit 1
            fi
            echo "Maven dependency resolution failed; retrying in $((attempt * 10)) seconds."
            sleep $((attempt * 10))
          done
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}

      - name: Unit Tests
        id: unit-tests
        run: mvn -B -ntp clean test jacoco:report jacoco:check
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Log JaCoCo Report URL
        if: steps.unit-tests.outcome == 'success'
        run: |
          echo "============================================================"
          echo "JaCoCo Coverage Report available as artifact:"
          echo "Artifact name: jacoco-report"
          echo "You can download it from the workflow run page."
          echo "============================================================"

      - name: Integration Tests
        run: mvn -B -ntp failsafe:integration-test failsafe:verify
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}

      - name: Mutation Testing
        id: mutation-tests
        run: mvn -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}

      - name: Upload PIT mutation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pit-report
          path: target/pit-reports
          if-no-files-found: ignore

      - name: Log PIT Report URL
        if: steps.mutation-tests.outcome == 'success'
        run: |
          echo "============================================================"
          echo "PIT Mutation Report available as artifact:"
          echo "Artifact name: pit-report"
          echo "You can download it from the workflow run page."
          echo "============================================================"

      - name: Package
        run: mvn -B -ntp package -DskipTests
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}
