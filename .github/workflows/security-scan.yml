name: Security Scan

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Prepare Gitleaks exceptions
        run: |
          rm -f -- .gitleaksignore
          {
            printf '[extend]\nuseDefault = true\n\n'
            printf '%s\n' "${GITLEAKS_ALLOWLIST:-}"
          } > "${{ runner.temp }}/gitleaks.toml"
          printf '%s' "${GITLEAKS_IGNORE:-}" > "${{ runner.temp }}/.gitleaksignore"
        env:
          GITLEAKS_ALLOWLIST: ${{ secrets.SECURITY_GITLEAKS_ALLOWLIST }}
          GITLEAKS_IGNORE: ${{ secrets.SECURITY_GITLEAKS_IGNORE }}

      - name: Run Gitleaks
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gitleaks git --config "${{ runner.temp }}/gitleaks.toml" \
              --gitleaks-ignore-path "${{ runner.temp }}/.gitleaksignore" --redact --exit-code 1 \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
          else
            ./gitleaks git --config "${{ runner.temp }}/gitleaks.toml" \
              --gitleaks-ignore-path "${{ runner.temp }}/.gitleaksignore" --redact --exit-code 1 .
          fi

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Java version from pom.xml
        id: java-version
        run: |
          JAVA_VERSION=$(grep -oPm1 "(?<=<java.version>)[^<]+" pom.xml)
          echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: 'temurin'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build application
        run: mvn -B -ntp -DskipTests package
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}

      - name: Generate trusted Trivy config
        run: printf '# Trusted Trivy config generated by the workflow (intentionally empty)\n' > "${{ runner.temp }}/trivy.yaml"

      - name: Prepare Trivy ignore file
        run: |
          printf '%s' "${TRIVY_IGNORE:-}" > "${{ runner.temp }}/.trivyignore"
          echo "TRIVY_IGNOREFILE=${{ runner.temp }}/.trivyignore" >> "$GITHUB_ENV"
        env:
          TRIVY_IGNORE: ${{ secrets.SECURITY_TRIVY_IGNORE }}

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivy-config: ${{ runner.temp }}/trivy.yaml

  image-scan:
    name: Image scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./DockerfileProduction
          push: false
          load: true
          tags: myvanitys-api:scan
          secrets: |
            "github_username=${{ github.actor }}"
            "github_token=${{ secrets.PACKAGES_TOKEN }}"

      - name: Generate trusted Trivy config
        run: printf '# Trusted Trivy config generated by the workflow (intentionally empty)\n' > "${{ runner.temp }}/trivy.yaml"

      - name: Prepare Trivy ignore file
        run: |
          printf '%s' "${TRIVY_IGNORE:-}" > "${{ runner.temp }}/.trivyignore"
          echo "TRIVY_IGNOREFILE=${{ runner.temp }}/.trivyignore" >> "$GITHUB_ENV"
        env:
          TRIVY_IGNORE: ${{ secrets.SECURITY_TRIVY_IGNORE }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'myvanitys-api:scan'
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivy-config: ${{ runner.temp }}/trivy.yaml
