---
name: Deploy to Railway

on:
  workflow_run:
    workflows: [ "CD Workflow" ]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Connect to Railway and Deploy
        run: |
          # Configurar variables de entorno importantes
          railway variables set SPRING_PROFILES_ACTIVE=prod
          railway variables set GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          railway variables set GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          railway variables set OAUTH_REDIRECT_URI=${{ secrets.OAUTH_REDIRECT_URI }}
          railway variables set JWT_SECRET=${{ secrets.JWT_SECRET }}

          # Link el proyecto de Railway
          railway link

          # Redeploy the image-source service, which pulls the latest scanned GHCR image
          railway redeploy --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
