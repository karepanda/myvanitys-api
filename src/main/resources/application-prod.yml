---
spring:
  datasource:
    hikari:
      connectionTimeout: 30000
      maximumPoolSize: 10
      minimumIdle: 5
      idleTimeout: 600000
      maxLifetime: 1800000
    # PostgreSQL configuration for Railway.
    # Runtime role: DML only (no DDL). Created by src/main/resources/db/roles/01-separate-roles.sql.
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    # Migration role: owns the schema objects and runs DDL, distinct from the runtime role.
    enabled: true
    url: ${FLYWAY_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
    table: flyway_schema_history


# OAuth configuration
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${OAUTH_REDIRECT_URI}

jwt:
  secret: "${JWT_SECRET}"
  expiration: 1800  # 30 minutes
  issuer: "myvanitys-production"

logging:
  level:
    org:
      springframework: WARN
      flywaydb: INFO
      hibernate: WARN
